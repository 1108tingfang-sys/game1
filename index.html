<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>喵喵理財跑酷</title>
  <style>
    :root{--ink:#16304c;--navy:#18375b;--sky:#8fe3ff;--yellow:#ffd84d;--coral:#ff7467;--mint:#60d9ac;--paper:#fffdf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#83dff5;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;overflow-x:hidden}.game{width:min(100%,960px);min-height:100vh;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 60px #277fa344}.top{height:90px;padding:13px clamp(14px,3vw,28px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(100deg,#fff9dc,#edfaff);position:relative;z-index:3}.brand{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;letter-spacing:.04em}.brand small{font-size:.62em;background:var(--yellow);padding:4px 8px;border-radius:99px;margin-left:4px}.stats{display:flex;gap:10px}.stat{background:white;border:2px solid #dcecf2;border-radius:14px;padding:7px 12px;font-weight:800;white-space:nowrap}.stat b{color:#e67e22}.world{height:calc(100vh - 90px);min-height:500px;position:relative;background:linear-gradient(#8fe3ff 0 66%,#ccf7ee 66% 70%,#56c794 70%);overflow:hidden}.cloud{position:absolute;color:#fff;opacity:.85;font-size:50px;animation:drift 13s linear infinite}.cloud:nth-child(1){top:7%;left:-10%;animation-duration:18s}.cloud:nth-child(2){top:18%;left:55%;font-size:38px;animation-delay:-8s}.hills{position:absolute;bottom:25%;width:130%;height:120px;left:-15%;background:radial-gradient(ellipse at 15% 100%,#78d6a0 0 38%,transparent 39%),radial-gradient(ellipse at 48% 100%,#49bd7d 0 42%,transparent 43%),radial-gradient(ellipse at 83% 100%,#70cf92 0 39%,transparent 40%)}.ground{position:absolute;bottom:0;height:30%;width:100%;background:repeating-linear-gradient(90deg,#e8bb65 0 26px,#f6d887 26px 52px);border-top:8px solid #6d4a35}.track{position:absolute;bottom:17%;left:0;width:100%;border-top:4px dashed #fff7bd;opacity:.8}.cat{position:absolute;left:14%;bottom:25%;font-size:clamp(62px,11vw,95px);filter:drop-shadow(0 7px 0 #ad7650);z-index:2;transform-origin:50% 100%;transition:bottom .12s}.cat.run{animation:bob .28s infinite alternate}.cat.jump{animation:none;bottom:52%;transform:rotate(-12deg)}.cat.duck{font-size:63px;transform:scaleY(.65);bottom:25%}.obstacle{position:absolute;right:-100px;bottom:25%;z-index:2;display:grid;place-items:center;filter:drop-shadow(0 4px 0 #80624c)}.obstacle.low{font-size:60px;height:64px}.obstacle.high{font-size:64px;height:145px;bottom:35%}.obstacle::after{content:"";position:absolute;bottom:-5px;width:70%;height:8px;background:#736251;border-radius:50%;z-index:-1}.tip{position:absolute;top:29%;left:50%;translate:-50%;background:#fffdf0cc;border:2px solid white;border-radius:16px;padding:10px 15px;font-weight:800;text-align:center;z-index:2;max-width:90%}.touch{position:absolute;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 24px;z-index:4}.control{border:0;border-radius:50%;width:76px;height:76px;background:var(--navy);color:white;font-size:1.05rem;font-weight:900;box-shadow:0 6px 0 #0d2138;touch-action:manipulation}.control.jump{background:var(--coral);box-shadow:0 6px 0 #b84745}.overlay{position:absolute;inset:0;background:#143455d9;z-index:10;display:grid;place-items:center;padding:22px}.card{width:min(590px,100%);background:#fffdf6;border-radius:28px;padding:clamp(24px,5vw,42px);box-shadow:0 14px 0 #0d263d;text-align:center}.card h1{font-size:clamp(1.8rem,6vw,3.1rem);margin:0 0 8px}.card p{font-size:1.06rem;line-height:1.65}.card .catface{font-size:76px;margin:0}.start,.answer{border:0;border-radius:16px;padding:14px 22px;font-size:1.08rem;font-weight:900;cursor:pointer;background:var(--yellow);color:#513d12;box-shadow:0 5px 0 #d7a819;margin-top:12px}.keys{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.key{background:#e7f5f8;padding:7px 10px;border-radius:9px;font-weight:800}.quiz{display:none}.quiz .tag{display:inline-block;background:#d9f7eb;color:#187754;padding:5px 12px;border-radius:99px;font-weight:900}.quiz h2{font-size:clamp(1.35rem,4vw,2rem);margin:14px 0}.options{display:grid;gap:10px;text-align:left}.answer{width:100%;margin:0;background:#eff8fb;color:var(--ink);box-shadow:0 3px 0 #bddbe4;text-align:left}.answer:hover{background:#d8f1f9}.feedback{font-weight:900;min-height:1.5em;margin:13px 0 0}.result{display:none}.coin-pop{position:absolute;color:#ffc400;font-size:34px;font-weight:900;z-index:8;animation:pop .8s forwards;text-shadow:0 2px white}@keyframes drift{to{transform:translateX(120vw)}}@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}@keyframes pop{to{transform:translateY(-60px);opacity:0}}@media(max-width:520px){.top{height:74px}.world{height:calc(100vh - 74px)}.stats{gap:5px}.stat{padding:6px 8px;font-size:.85rem}.brand small{display:none}.tip{top:24%}.touch{bottom:13px}.control{width:68px;height:68px;font-size:.93rem}}
  </style>
</head>
<body><main class="game" aria-label="喵喵理財跑酷遊戲">
  <header class="top"><div class="brand">🐱 喵喵理財跑酷 <small>小小金錢家</small></div><div class="stats"><div class="stat">🪙 <b id="coins">100</b></div><div class="stat">🏃 <span id="distance">0</span> m</div></div></header>
  <section class="world" id="world"><div class="cloud">☁️</div><div class="cloud">☁️</div><div class="hills"></div><div class="tip" id="tip">按「開始」後，躲開障礙物！</div><div class="track"></div><div class="cat" id="cat">🐱</div><div class="ground"></div><div class="touch"><button class="control jump" id="jumpBtn">跳高<br>↑</button><button class="control" id="duckBtn">蹲低<br>↓</button></div></section>
  <section class="overlay" id="startScreen"><div class="card"><div class="catface">🐱💨🪙</div><h1>喵喵理財跑酷</h1><p>跟著貓咪一邊奔跑，一邊學會聰明使用錢！<br>撞到障礙物會出現理財題，答對就能賺金幣。</p><div class="keys"><span class="key">空白鍵 / ↑ 跳高</span><span class="key">↓ 蹲低</span></div><button class="start" id="startBtn">開始冒險！</button></div></section>
  <section class="overlay quiz" id="quiz"><div class="card"><span class="tag" id="tag">理財小挑戰</span><h2 id="question"></h2><div class="options" id="options"></div><p class="feedback" id="feedback"></p></div></section>
  <section class="overlay result" id="result"><div class="card"><div class="catface">🏆🐱</div><h1>今天跑得真棒！</h1><p id="resultText"></p><button class="start" id="againBtn">再跑一次</button></div></section>
</main>
<script>
const questions=[
 {t:'想要與需要',q:'下雨天沒有雨傘，媽媽說可以買一把。這是？',a:['需要，因為可以保護身體不淋濕','想要，因為雨傘很漂亮'],c:0,e:'雨傘能在下雨時保護我們，是生活需要。'},
 {t:'儲蓄與存錢筒',q:'你想買 300 元的美術組，現在有 120 元。最好的方法是？',a:['把每週零用錢存一部分','把所有零用錢一次花掉'],c:0,e:'設定目標、慢慢存錢，就能買到想要的東西！'},
 {t:'理性消費',q:'商店正在特價，但你不需要那個玩具，該怎麼做？',a:['先不買，把錢留給需要或目標','因為特價所以立刻買'],c:0,e:'特價不等於需要，先想一想再決定。'},
 {t:'賺錢與預算',q:'幫家人完成額外家事得到 50 元，想存錢也想買點心。可以？',a:['規劃：30 元存起來，20 元買點心','把 50 元全部花光'],c:0,e:'預算能讓錢有計畫，也兼顧現在與未來。'},
 {t:'利息與分享',q:'把錢存進銀行，銀行可能多給你的錢叫做？',a:['利息','折價券'],c:0,e:'利息是把錢存起來一段時間可能得到的小獎勵。'},
 {t:'分享',q:'你有兩枝全新的鉛筆，朋友忘了帶，你會？',a:['借一枝給朋友，一起學習','笑他沒有準備'],c:0,e:'分享與互相幫忙，會讓班級更溫暖。'},
 {t:'聰明比較',q:'兩家店的同一個水壺價格不同，買之前應該？',a:['比較價格和需要，再決定','不看價格，隨便選'],c:0,e:'比較選擇是聰明消費的第一步。'}
];
const el=id=>document.getElementById(id);let coins=100,distance=0,speed=5,playing=false,paused=false,obstacle=null,last=0,spawnAt=0,qIndex=0,ducking=false;
function update(){el('coins').textContent=coins;el('distance').textContent=Math.floor(distance)}
function start(){coins=100;distance=0;speed=5;playing=true;paused=false;obstacle?.remove();obstacle=null;el('startScreen').style.display='none';el('result').style.display='none';el('cat').className='cat run';el('tip').textContent='跳過石頭、箱子；蹲低躲過飛鳥！';update();last=performance.now();requestAnimationFrame(loop)}
function jump(){if(!playing||paused||ducking)return;const c=el('cat');c.classList.add('jump');setTimeout(()=>c.classList.remove('jump'),520)}
function duck(on){if(!playing||paused)return;ducking=on;el('cat').classList.toggle('duck',on)}
function makeObstacle(){const high=Math.random()<.38;obstacle=document.createElement('div');obstacle.className='obstacle '+(high?'high':'low');obstacle.dataset.type=high?'high':'low';obstacle.textContent=high?'🐦':Math.random()<.5?'🪨':'📦';el('world').append(obstacle)}
function hit(){paused=true;playing=false;obstacle?.remove();obstacle=null;showQuiz()}
function loop(now){if(!playing)return;const dt=Math.min(36,now-last);last=now;distance+=dt*.013*speed;speed=5+Math.min(7,distance/130);update();if(!obstacle&&now>spawnAt){makeObstacle();spawnAt=now+1000+Math.random()*1000}if(obstacle){const rect=obstacle.getBoundingClientRect(),cat=el('cat').getBoundingClientRect();obstacle.style.right=(parseFloat(obstacle.style.right||-100)+dt*.13*speed)+'px';const overlap=rect.left<cat.right-10&&rect.right>cat.left+15;const needsJump=obstacle.dataset.type==='low'&&cat.bottom>rect.top+14;const needsDuck=obstacle.dataset.type==='high'&&!ducking;if(overlap&&(needsJump||needsDuck))hit();if(rect.right<0){obstacle.remove();obstacle=null}}requestAnimationFrame(loop)}
function showQuiz(){const q=questions[qIndex++%questions.length];el('quiz').style.display='grid';el('tag').textContent=q.t;el('question').textContent=q.q;el('feedback').textContent='';el('options').innerHTML='';q.a.forEach((x,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=(i===0?'A. ':'B. ')+x;b.onclick=()=>answer(i,q);el('options').append(b)})}
function answer(i,q){const good=i===q.c;coins+=good?20:-10;coins=Math.max(0,coins);el('feedback').textContent=good?'答對了！+20 金幣 ✨ '+q.e:'再想想看！-10 金幣 '+q.e;[...el('options').children].forEach(b=>b.disabled=true);pop(good?'+20 🪙':'-10 🪙');update();setTimeout(()=>{el('quiz').style.display='none';if(coins<=0)finish();else{playing=true;paused=false;last=performance.now();requestAnimationFrame(loop)}},2000)}
function pop(text){const p=document.createElement('div');p.className='coin-pop';p.textContent=text;p.style.left='44%';p.style.top='43%';el('world').append(p);setTimeout(()=>p.remove(),850)}
function finish(){el('resultText').textContent=`你跑了 ${Math.floor(distance)} 公尺，帶著 ${coins} 枚金幣回家！記得：先分清想要與需要，再為目標存錢。`;el('result').style.display='grid'}
el('startBtn').onclick=start;el('againBtn').onclick=start;el('jumpBtn').onclick=jump;['pointerdown','touchstart'].forEach(e=>el('duckBtn').addEventListener(e,()=>duck(true)));['pointerup','pointercancel','pointerleave','touchend'].forEach(e=>el('duckBtn').addEventListener(e,()=>duck(false)));document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown')duck(true)});document.addEventListener('keyup',e=>{if(e.key==='ArrowDown')duck(false)});
</script></body></html>
